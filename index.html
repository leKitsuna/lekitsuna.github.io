<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>katanetwork — showing your "real speed"</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-layer bg-gradient"></div>
  <div class="bg-layer bg-pattern"></div>

  <div class="app">

    <div class="title-block" id="titleBlock">
      <h1>katanetwork</h1>
      <p class="slogan">showing your "real speed"</p>
    </div>

    <div class="footer-copy" id="footerCopy">© 2026 yuikkonu</div>

    <div class="begin-container" id="beginContainer">
      <button class="btn-begin" id="btnBegin">Begin</button>
    </div>

    <div class="testing-overlay" id="testingOverlay">
      <div class="testing-text">
        Testing<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>

      <div class="globe-icon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="44" stroke="white" stroke-width="2.5"/>
          <ellipse cx="50" cy="50" rx="20" ry="44" stroke="white" stroke-width="2.5"/>
          <ellipse cx="50" cy="50" rx="44" ry="20" stroke="white" stroke-width="2.5"/>
          <line x1="6" y1="50" x2="94" y2="50" stroke="white" stroke-width="2.5"/>
          <line x1="50" y1="6" x2="50" y2="94" stroke="white" stroke-width="2.5"/>
        </svg>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="results-container" id="resultsContainer">
      <div class="results-cards">
        <div class="result-card" id="cardDownload">
          <span class="card-label">Download<br>Speed</span>
          <span class="card-value" id="valDownload">—</span>
          <span class="card-unit">Mbit/s</span>
        </div>
        <div class="result-card" id="cardUpload">
          <span class="card-label">Upload<br>Speed</span>
          <span class="card-value" id="valUpload">—</span>
          <span class="card-unit">Mbit/s</span>
        </div>
        <div class="result-card" id="cardLatency">
          <span class="card-label">Latency</span>
          <span class="card-value" id="valLatency">—</span>
          <span class="card-unit">ms</span>
        </div>
      </div>

      <button class="btn-return" id="btnReturn">Return</button>

      <div class="btn-details" id="btnDetails">
        <div class="arrow-circle">
          <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="13 6 19 12 13 18"/>
          </svg>
        </div>
        <span class="details-label">See details</span>
      </div>
    </div>

    <div class="detail-overlay" id="detailOverlay">
      <div class="detail-block" id="detailBlock">
        <div class="detail-title">Detailed Results</div>

        <div class="detail-section-label">Speeds</div>
        <div class="detail-row">
          <span class="detail-label">Download</span>
          <span class="detail-value" id="detDownload">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Download</span>
          <span class="detail-value" id="detDownloadMB">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Upload</span>
          <span class="detail-value" id="detUpload">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Upload</span>
          <span class="detail-value" id="detUploadMB">—</span>
        </div>

        <div class="detail-section-label">Network</div>
        <div class="detail-row">
          <span class="detail-label">Latency</span>
          <span class="detail-value" id="detLatency">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Packet Loss</span>
          <span class="detail-value" id="detPacketLoss">—</span>
        </div>

        <div class="detail-section-label">Test Info</div>
        <div class="detail-row">
          <span class="detail-label">Time Started</span>
          <span class="detail-value" id="detTime">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Time Completed</span>
          <span class="detail-value" id="detTimeEnd">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Browser</span>
          <span class="detail-value" id="detBrowser">—</span>
        </div>
      </div>

      <button class="btn-return-detail" id="btnReturnDetail">Return</button>
    </div>

  </div>

  <script>
    (() => {
      'use strict';

      const titleBlock      = document.getElementById('titleBlock');
      const footerCopy      = document.getElementById('footerCopy');
      const beginContainer  = document.getElementById('beginContainer');
      const btnBegin        = document.getElementById('btnBegin');
      const testingOverlay  = document.getElementById('testingOverlay');
      const progressFill    = document.getElementById('progressFill');
      const resultsContainer= document.getElementById('resultsContainer');
      const cardDownload    = document.getElementById('cardDownload');
      const cardUpload      = document.getElementById('cardUpload');
      const cardLatency     = document.getElementById('cardLatency');
      const valDownload     = document.getElementById('valDownload');
      const valUpload       = document.getElementById('valUpload');
      const valLatency      = document.getElementById('valLatency');
      const btnReturn       = document.getElementById('btnReturn');
      const btnDetails      = document.getElementById('btnDetails');
      const detailOverlay   = document.getElementById('detailOverlay');
      const detailBlock     = document.getElementById('detailBlock');
      const btnReturnDetail = document.getElementById('btnReturnDetail');

      const detDownload     = document.getElementById('detDownload');
      const detDownloadMB   = document.getElementById('detDownloadMB');
      const detUpload       = document.getElementById('detUpload');
      const detUploadMB     = document.getElementById('detUploadMB');
      const detLatency      = document.getElementById('detLatency');
      const detPacketLoss   = document.getElementById('detPacketLoss');
      const detTime         = document.getElementById('detTime');
      const detTimeEnd      = document.getElementById('detTimeEnd');
      const detBrowser      = document.getElementById('detBrowser');

      let cachedResults = null;

      function hideWithFade(el, duration = 600) {
        return new Promise(resolve => {
          el.style.transition = `opacity ${duration}ms ease, transform ${duration}ms ease`;
          el.style.opacity = '0';
          el.style.transform = el.style.transform || 'scale(0.96)';
          setTimeout(resolve, duration);
        });
      }

      function showWithFade(el, duration = 800) {
        return new Promise(resolve => {
          el.style.transition = `opacity ${duration}ms ease, transform ${duration}ms ease`;
          el.style.opacity = '1';
          el.style.transform = 'translateY(0) scale(1)';
          setTimeout(resolve, duration);
        });
      }

      function formatTime(date) {
        const pad = n => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
      }

      function getBrowserName() {
        const ua = navigator.userAgent;
        if (ua.includes('Edg/')) return 'Microsoft Edge';
        if (ua.includes('OPR/') || ua.includes('Opera')) return 'Opera';
        if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Google Chrome';
        if (ua.includes('Firefox')) return 'Mozilla Firefox';
        if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Apple Safari';
        return 'Unknown Browser';
      }

      function runSpeedTest() {
        return new Promise(resolve => {
          const startTime = new Date();
          const totalDuration = 35000; // 35 seconds
          const updateInterval = 200;
          let elapsed = 0;

          const targetDownload = 150 + Math.random() * 350; // 150-500 Mbit/s
          const targetUpload   = 50 + Math.random() * 200;  // 50-250 Mbit/s
          const targetLatency  = 5 + Math.random() * 45;     // 5-50 ms
          const targetPacketLoss = Math.random() < 0.3 ? 0 : (Math.random() * 2.5).toFixed(1);

          const interval = setInterval(() => {
            elapsed += updateInterval;
            const progress = Math.min(elapsed / totalDuration, 1);

            progressFill.style.width = `${progress * 100}%`;

            if (progress >= 1) {
              clearInterval(interval);

              const endTime = new Date();

              cachedResults = {
                download: targetDownload.toFixed(1),
                upload: targetUpload.toFixed(1),
                latency: targetLatency.toFixed(1),
                downloadMB: (targetDownload / 8).toFixed(2),
                uploadMB: (targetUpload / 8).toFixed(2),
                packetLoss: targetPacketLoss + '%',
                timeStart: formatTime(startTime),
                timeEnd: formatTime(endTime),
                browser: getBrowserName(),
                userAgent: navigator.userAgent
              };

              localStorage.setItem('katanetwork_results', JSON.stringify(cachedResults));

              resolve(cachedResults);
            }
          }, updateInterval);
        });
      }

      function resetToInitial() {
        cachedResults = null;
        localStorage.removeItem('katanetwork_results');
        progressFill.style.width = '0%';

        resultsContainer.classList.remove('active');
        detailOverlay.classList.remove('active');

        [cardDownload, cardUpload, cardLatency].forEach(c => c.classList.remove('visible'));
        btnReturn.classList.remove('visible');
        btnDetails.classList.remove('visible');
        detailBlock.classList.remove('visible');
        btnReturnDetail.classList.remove('visible');

        titleBlock.classList.remove('hidden');
        footerCopy.style.opacity = '0.4';
        beginContainer.classList.remove('hidden');

        testingOverlay.classList.remove('active');
      }

      function showResults(results) {
        valDownload.textContent = results.download;
        valUpload.textContent = results.upload;
        valLatency.textContent = results.latency;

        resultsContainer.classList.add('active');

        setTimeout(() => cardDownload.classList.add('visible'), 100);
        setTimeout(() => cardUpload.classList.add('visible'), 300);
        setTimeout(() => cardLatency.classList.add('visible'), 500);
        setTimeout(() => btnReturn.classList.add('visible'), 700);
        setTimeout(() => btnDetails.classList.add('visible'), 800);
      }

      function showDetailedResults(results) {
        detDownload.textContent = results.download + ' Mbit/s';
        detDownloadMB.textContent = results.downloadMB + ' MByte/s';
        detUpload.textContent = results.upload + ' Mbit/s';
        detUploadMB.textContent = results.uploadMB + ' MByte/s';
        detLatency.textContent = results.latency + ' ms';
        detPacketLoss.textContent = results.packetLoss;
        detTime.textContent = results.timeStart;
        detTimeEnd.textContent = results.timeEnd;
        detBrowser.textContent = results.browser;

        resultsContainer.classList.remove('active');
        detailOverlay.classList.add('active');

        setTimeout(() => detailBlock.classList.add('visible'), 100);
        setTimeout(() => btnReturnDetail.classList.add('visible'), 300);
      }

      function hideDetailedResults() {
        detailOverlay.classList.remove('active');
        detailBlock.classList.remove('visible');
        btnReturnDetail.classList.remove('visible');
        resultsContainer.classList.add('active');
      }


      btnBegin.addEventListener('click', async () => {
        titleBlock.classList.add('hidden');
        footerCopy.style.opacity = '0';
        beginContainer.classList.add('hidden');

        await new Promise(r => setTimeout(r, 600));

        testingOverlay.classList.add('active');

        const globeIcon = document.querySelector('.globe-icon');
        globeIcon.style.animation = 'none';
        globeIcon.offsetHeight; // force reflow
        globeIcon.style.animation = 'fadeGlobe 0.8s ease 0.3s forwards';

        const results = await runSpeedTest();

        testingOverlay.classList.remove('active');

        await new Promise(r => setTimeout(r, 600));

        globeIcon.style.animation = 'none';
        globeIcon.style.opacity = '0';
        progressFill.style.width = '0%';

        titleBlock.classList.remove('hidden');
        footerCopy.style.opacity = '0.4';
        showResults(results);
      });

      btnReturn.addEventListener('click', () => {
        resetToInitial();
      });

      btnDetails.addEventListener('click', () => {
        if (cachedResults) {
          showDetailedResults(cachedResults);
        }
      });

      btnReturnDetail.addEventListener('click', () => {
        hideDetailedResults();
      });

      (() => {
        const cached = localStorage.getItem('katanetwork_results');
        if (cached) {
          try {
            cachedResults = JSON.parse(cached);
          } catch(e) {
            cachedResults = null;
          }
        }
      })();

    })();
  </script>
</body>
</html>
